name: Bump version
run-name: Bump version to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (for example 1.9.5 or 1.9.5-rc.1; no v prefix)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.301"
      - name: Bump version and push
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./bump-version.sh --push "$RELEASE_VERSION"
      - name: Start compiled release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f "tag=$RELEASE_VERSION"
